[project]
name = "edgeveil"
version = "0.1.0"
description = "On-device PII masking proxy for cloud LLMs"
readme = "README.md"
authors = [
    { name = "Dhruv Dubey", email = "dd.dhruv1@gmail.com" }
]
requires-python = ">=3.13,<3.14"
dependencies = [
    "fastapi>=0.142.2",
    "httpx>=0.28.1",
    "onnxruntime>=1.30.0",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "rich>=15.0.0",
    "typer>=0.27.3",
    "uvicorn>=0.54.0",
]

[project.scripts]
edgeveil = "edgeveil.cli:app"

[project.optional-dependencies]
train = [
    "datasets>=5.1.0",
    "seqeval>=1.2.2",
    "torch>=2.14.1",
    "transformers>=5.19.0",
]
coreml = [
    "coremltools>=9.0",
]
qualcomm = [
    "qai-hub>=0.56.0",
]
eval = [
    "seqeval>=1.2.2",
]

[build-system]
requires = ["uv_build>=0.11.7,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "anyio>=4.15.1",
    "hypothesis>=6.168.5",
    "pyright>=1.1.414",
    "pytest>=9.1.1",
    "pytest-socket>=0.8.1",
    "ruff>=0.16.10",
]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF", "PTH", "PL", "ERA"]

[tool.ruff.lint.per-file-ignores]
"src/edgeveil/cli/*" = ["PLC0415"]
"tests/*" = ["PLR2004"]

[tool.pyright]
include = ["src", "tests"]
venvPath = "."
venv = ".venv"
typeCheckingMode = "standard"
strict = [
    "src/edgeveil/__init__.py",
    "src/edgeveil/spans.py",
    "src/edgeveil/dataset/openpii.py",
    "src/edgeveil/masker",
    "src/edgeveil/validators",
    "src/edgeveil/proxy",
    "src/edgeveil/cli",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--disable-socket", "--allow-unix-socket", "--strict-markers"]

[tool.coverage.report]
exclude_also = ["if TYPE_CHECKING:", "class .*\\(Protocol\\):"]

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
